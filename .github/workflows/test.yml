---
name: "Test"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "qa/**"
      - "stable/**"
jobs:
  integration:
    name: "Integration ${{ matrix.ubuntu-version }} with ${{ matrix.python-version }}"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [
          "24.04",
          "26.04",
        ]
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Save user id"
        id: user_id
        run: |
          echo "user_id=$(id -u)" >> $GITHUB_OUTPUT
      - name: "Save group id"
        id: group_id
        run: |
          echo "group_id=$(id -g)" >> $GITHUB_OUTPUT
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003" # v4.4.0
      - name: "Build the archivematica-storage-service-tests image"
        uses: "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc" # v7.4.0
        with:
          target: "archivematica-storage-service-tests"
          build-args: |
            USER_ID=${{ steps.user_id.outputs.user_id }}
            GROUP_ID=${{ steps.group_id.outputs.group_id }}
            UBUNTU_VERSION=${{ matrix.ubuntu-version }}
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: "archivematica-storage-service-tests:latest"
          push: false
          load: true
          cache-from: "type=gha,scope=archivematica-storage-service-tests-${{ matrix.ubuntu-version }}-${{ matrix.python-version }}"
          cache-to: "type=gha,scope=archivematica-storage-service-tests-${{ matrix.ubuntu-version }}-${{ matrix.python-version }},mode=max"
      - name: "Run tests"
        id: "run-tests"
        run: |
          ./run.sh
        shell: "bash"
        working-directory: "tests/integration"
        env:
          USER_ID: ${{ steps.user_id.outputs.user_id }}
          GROUP_ID: ${{ steps.group_id.outputs.group_id }}
          UBUNTU_VERSION: ${{ matrix.ubuntu-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          REUSE_TEST_ENV: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          PYTEST_ADDOPTS: -vv --cov --cov-config=pyproject.toml --cov-report xml:coverage.xml --tracing retain-on-failure --screenshot only-on-failure
      - name: "Save docker logs on failure"
        if: "${{ (failure() && steps.run-tests.outcome == 'failure') || (cancelled() && steps.run-tests.outcome == 'cancelled') }}"
        run: |
          mkdir -p docker-logs
          docker compose logs --no-color > docker-logs/docker-compose.log
          docker compose ps --all > docker-logs/docker-compose-ps.log
        working-directory: "tests/integration"
      - name: "Upload docker logs on failure"
        if: "${{ (failure() && steps.run-tests.outcome == 'failure') || (cancelled() && steps.run-tests.outcome == 'cancelled') }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "docker-logs-${{ matrix.ubuntu-version }}-${{ matrix.python-version }}"
          path: "tests/integration/docker-logs"
      - name: "Upload Playwright traces on failure"
        if: "${{ (failure() && steps.run-tests.outcome == 'failure') || (cancelled() && steps.run-tests.outcome == 'cancelled') }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "playwright-traces-${{ matrix.ubuntu-version }}-${{ matrix.python-version }}"
          path: "test-results"
      - name: "Upload coverage report"
        if: github.repository == 'artefactual/archivematica-storage-service'
        uses: "codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4" # v7.1.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  checks:
    name: "Checks"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4" # v10.1.0
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            uv.lock
          cache-suffix: "checks"
      - name: "Install OS packages"
        run: |
          sudo apt-get --quiet update
          sudo apt-get install --quiet --yes build-essential \
            libmysqlclient-dev libsasl2-dev libldap2-dev libssl-dev
      - name: "Run checks"
        run: |
          make check
  frontend:
    name: "Test frontend"
    runs-on: "ubuntu-24.04"
    defaults:
      run:
        working-directory: "./src/archivematica/storage_service/frontend/"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up Node JS"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            src/archivematica/storage_service/frontend/package-lock.json
      - name: "Install frontend dependencies"
        run: |
          npm clean-install
      - name: "Run frontend checks"
        run: |
          npm run check
