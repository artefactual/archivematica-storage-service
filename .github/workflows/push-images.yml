name: "Push images to Docker Hub"
on: workflow_dispatch
jobs:
  build:
    name: "Build and push images"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003" # v4.4.0
      - name: "Log in to Docker Hub"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Build and push Storage Service"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          load: true
          file: ./Dockerfile
          target: "archivematica-storage-service"
          tags: artefactual/archivematica-storage-service:latest
