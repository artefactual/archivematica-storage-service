{% extends "base.html" %}
{% load i18n %}

{% block page_title %}{% trans "Create Space" %}{% endblock %}
{% block data_features_page %}space-protocol{% endblock %}

{% block content %}

<div class='space'>
    <form
      action="{% url 'locations:space_create' %}"
      method="post"
      data-space-protocol-form-url="{% url 'locations:ajax_space_create_protocol_form' %}"
    >{% csrf_token %}
        {{ space_form.as_p }}
        <div id="protocol_form">{{ protocol_form.as_p|default:"" }}</div>
        <input type="submit" value="{% trans "Create Space" %}" class='btn btn-primary' />
    </form>
</div>
{% endblock %}
