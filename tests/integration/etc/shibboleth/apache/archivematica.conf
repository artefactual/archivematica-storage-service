# Development-only Apache configuration for the Shibboleth service provider in
# front of the Storage Service. The service provider sits in front of the
# Storage Service live test server on port 8000.
#
# Self-referential URLs, including the assertion consumer service URL sent to
# the identity provider, are built from the Host header the client sends
# (UseCanonicalName Off), so this file carries no host ports.
#
# mod_shib exports the released attributes as request headers and drops any
# the client sent under the same names, so only its own values reach the
# application. The /Shibboleth.sso handler and the /shibboleth-sp assets are
# configured by the package's conf-enabled/shib.conf.

<VirtualHost *:8000>
    ServerName localhost
    UseCanonicalName Off

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 172800

    <Location />
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        ShibRequestSetting applicationId storage-service
        ShibUseHeaders On
        Require valid-user
    </Location>

    <Location /api>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    # Shown after logout, once the Shibboleth session is gone, along with the
    # static files and the JavaScript catalog it loads, which the Storage
    # Service serves to anyone.
    <Location /logged-out>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    <Location /static>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    <Location /jsi18n>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    ProxyPass / http://archivematica-storage-service:8000/
    ProxyPassReverse / http://archivematica-storage-service:8000/
</VirtualHost>
