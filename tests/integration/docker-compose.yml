---
name: ss-integration

configs:

  seaweedfs-setup:
    content: |
      set -eu
      while :; do
        output=$(
          weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1 <<'EOF' || true
      s3.iam.import -file=/config/iam.json -apply
      s3.policy -put -name=AdminAccess -file=/config/policies/admin-access.json
      s3.policy -put -name=BrowseBuckets -file=/config/policies/browse-buckets.json
      s3.config.show
      EOF
        )
        printf '%s\n' "$$output"

        if ! printf '%s\n' "$$output" | grep -qi '^error:'; then
          break
        fi

        sleep 1
      done

  keycloak-healthcheck:
    # The Keycloak image ships no curl/wget, so use bash's /dev/tcp. Gate on
    # the OIDC discovery document of every realm the tests log in to, which
    # is only served once `--import-realm` has finished.
    content: |
      for realm in demo secondary; do
        exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf 'GET /realms/%s/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' "$$realm" >&3 &&
        head -n 1 <&3 | grep -q ' 200 ' || exit 1
      done

services:

  archivematica-storage-service:
    build:
      context: "../../"
      dockerfile: "Dockerfile"
      args:
        TARGET: "archivematica-storage-service-tests"
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-}
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox"]
    hostname: "archivematica-storage-service"
    environment:
      PYTEST_ADDOPTS: ${PYTEST_ADDOPTS:-}
      RUN_INTEGRATION_TESTS: "true"
      DJANGO_LIVE_TEST_SERVER_ADDRESS: "archivematica-storage-service:8000"
      DJANGO_ALLOW_ASYNC_UNSAFE: true
      FORWARDED_ALLOW_IPS: "*"
      SS_GUNICORN_ACCESSLOG: "/dev/null"
      DJANGO_SETTINGS_MODULE: "archivematica.storage_service.storage_service.settings.testmysql"
      # /src is bind-mounted, so point Django staticfiles to the image-owned dist copy.
      SS_FRONTEND_DIST_DIR: "/opt/ss-frontend-dist"
      SS_GNUPG_HOME_PATH: "/var/archivematica/storage_service/.gnupg"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: "Lax"
      CSRF_COOKIE_SECURE: "false"
      RCLONE_CONFIG_MYS3_TYPE: "s3"
      RCLONE_CONFIG_MYS3_PROVIDER: "SeaweedFS"
      RCLONE_CONFIG_MYS3_ENDPOINT: "http://seaweedfs:8333"
      RCLONE_CONFIG_MYS3_ACCESS_KEY_ID: "ss"
      RCLONE_CONFIG_MYS3_SECRET_ACCESS_KEY: "ss123"
      RCLONE_CONFIG_MYS3_REGION: "us-east-1"
      SS_OIDC_AUTHENTICATION: "true"
      OIDC_USE_PKCE: "true"
      OIDC_PKCE_CODE_CHALLENGE_METHOD: "S256"
      OIDC_RP_CLIENT_ID: "am-storage-service"
      OIDC_RP_CLIENT_SECRET: "example-secret"
      OIDC_OP_AUTHORIZATION_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/auth"
      OIDC_OP_TOKEN_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/token"
      OIDC_OP_USER_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/userinfo"
      OIDC_OP_JWKS_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/certs"
      OIDC_OP_LOGOUT_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/logout"
      OIDC_OP_SET_ROLES_FROM_CLAIMS: "true"
      OIDC_OP_ROLE_CLAIM_PATH: "realm_access.roles"
      OIDC_ROLE_CLAIM_ADMIN: "admin"
      OIDC_ROLE_CLAIM_MANAGER: "manager"
      OIDC_ROLE_CLAIM_REVIEWER: "reviewer"
      OIDC_ROLE_CLAIM_READER: "reader"
      OIDC_ACCESS_ATTRIBUTE_MAP: >
        {"given_name": "first_name", "family_name": "last_name", "realm_access": "realm_access"}
      OIDC_SECONDARY_PROVIDER_NAMES: "secondary"
      OIDC_RP_CLIENT_ID_SECONDARY: "am-storage-service-secondary"
      OIDC_RP_CLIENT_SECRET_SECONDARY: "example-secret-secondary"
      OIDC_OP_AUTHORIZATION_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/auth"
      OIDC_OP_TOKEN_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/token"
      OIDC_OP_USER_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/userinfo"
      OIDC_OP_JWKS_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/certs"
      OIDC_OP_LOGOUT_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/logout"
      OIDC_OP_SET_ROLES_FROM_CLAIMS_SECONDARY: "true"
      OIDC_OP_ROLE_CLAIM_PATH_SECONDARY: "realm_access.roles"
      OIDC_ROLE_CLAIM_ADMIN_SECONDARY: "admin-secondary"
      OIDC_ROLE_CLAIM_MANAGER_SECONDARY: "manager-secondary"
      OIDC_ROLE_CLAIM_REVIEWER_SECONDARY: "reviewer-secondary"
      OIDC_ROLE_CLAIM_READER_SECONDARY: "reader-secondary"
      OIDC_ACCESS_ATTRIBUTE_MAP_SECONDARY: >
        {"given_name": "first_name", "family_name": "last_name", "realm_access": "realm_access"}
      OIDC_RP_SIGN_ALGO: "RS256"
    volumes:
      - "../../:/src"
    depends_on:
      mysql:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  seaweedfs:
    image: "chrislusf/seaweedfs:4.45"
    command: ["mini", "-dir=/data"]
    environment:
      WEED_ADMIN_USER: "admin"
      WEED_ADMIN_PASSWORD: "admin123"
    expose:
      - "8333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)\" = \"403\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - "./etc/seaweedfs:/config:ro"

  seaweedfs-setup:
    image: "chrislusf/seaweedfs:4.45"
    entrypoint: []
    command: ["/bin/sh", "/setup.sh"]
    configs:
      - source: "seaweedfs-setup"
        target: "/setup.sh"
    depends_on:
      seaweedfs:
        condition: service_started
    volumes:
      - "./etc/seaweedfs:/config:ro"

  mysql:
    image: "percona/percona-server:8.4.11-11.1"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      # These are used in the storage_service.settings.testmysql module
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
      MYSQL_DATABASE: "test_SSTEST"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.3-0"
    command: ["start-dev", "--import-realm"]
    restart: "unless-stopped"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: "INFO"
    ports:
      - 8080:8080
    volumes:
      - "./etc/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"
    configs:
      - source: "keycloak-healthcheck"
        target: "/healthcheck.sh"
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
